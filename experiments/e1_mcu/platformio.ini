; E1 - Benchmark FIR 16-tap Q15 tren STM32F103 (Cortex-M3), bare-metal CMSIS
;   pio run -e f103c6           build cho STM32F103C6 (32KB Flash, 10KB RAM)
;   pio run -e f103c6 -t upload nap qua ST-Link (SWD)
;   python ../tools/capture_serial.py mcu COM10 (hoac COM qua USB-UART PA9)
;
[platformio]
default_envs = f103c6

[env:f103c6]
platform = ststm32
board = bluepill_f103c6
framework = cmsis
platform_packages = platformio/framework-cmsis-dsp@~1.16.2
upload_protocol = stlink
debug_tool = stlink
lib_extra_dirs = ../common
build_flags =
    -O2
    -Wall
    -DFIR_MCU
extra_scripts = pre:cmsis_dsp_fir.py

[env:f103]
platform = ststm32
board = bluepill_f103c8
framework = cmsis
platform_packages = platformio/framework-cmsis-dsp@~1.16.2
upload_protocol = stlink
debug_tool = stlink
lib_extra_dirs = ../common
build_flags =
    -O2
    -Wall
    -DFIR_MCU
extra_scripts = pre:cmsis_dsp_fir.py
